spring:
  datasource:
    url: jdbc:h2:mem:approval_system_test_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

flowable:
  database-schema-update: true
  process:
    definition-location-prefix: classpath:/processes/
  rest:
    api:
      enabled: true

app:
  upload:
    path: ${UPLOAD_PATH:./target/test-uploads}
    allowed-extensions: pdf,docx,xlsx,pptx,png,jpg,jpeg

security:
  jwt:
    issuer: approval-system
    secret: "approval-system-jwt-secret-key-change-this-please-32bytes"
    access-token-minutes: 120
    challenge-token-minutes: 5
  totp:
    issuer: ApprovalSystem
  account:
    max-login-attempts: 5
    lock-duration-minutes: 30
  audit:
    login-logs-retention-days: 90
