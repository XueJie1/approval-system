<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能协同审批系统 - 管理员初始化</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .register-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      width: 420px;
      max-width: 90%;
      margin: 20px;
    }
    
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .register-header h1 {
      color: #333;
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 10px 0;
    }
    
    .register-header p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    
    .warning-box {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    
    .warning-box .icon {
      color: #faad14;
      font-size: 20px;
      flex-shrink: 0;
    }
    
    .warning-box .content {
      flex: 1;
    }
    
    .warning-box .content h3 {
      margin: 0 0 8px 0;
      color: #d48806;
      font-size: 15px;
    }
    
    .warning-box .content p {
      margin: 0;
      color: #856404;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .register-form {
      margin-top: 20px;
    }
    
    .register-form .el-form-item {
      margin-bottom: 24px;
    }
    
    .register-form .el-input__wrapper {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
    }
    
    .password-strength {
      margin-top: 8px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }
    
    .password-strength .bar {
      height: 100%;
      transition: all 0.3s ease;
    }
    
    .password-strength .bar.weak {
      width: 33%;
      background: #f56c6c;
    }
    
    .password-strength .bar.medium {
      width: 66%;
      background: #faad14;
    }
    
    .password-strength .bar.strong {
      width: 100%;
      background: #52c41a;
    }
    
    .register-btn {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    
    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3) !important;
    }
    
    .error-message {
      color: #f56c6c;
      font-size: 13px;
      margin-top: 5px;
      text-align: left;
      display: none;
    }
    
    .success-message {
      color: #52c41a;
      font-size: 13px;
      margin-top: 5px;
      text-align: center;
      display: none;
    }
    
    .back-link {
      text-align: center;
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
    
    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      margin-left: 5px;
    }
    
    .back-link a:hover {
      color: #764ba2;
    }
    
    .loading {
      pointer-events: none;
    }
    
    @media (max-width: 480px) {
      .register-container {
        padding: 30px 20px;
        width: 95%;
      }
      
      .register-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h1>管理员初始化</h1>
      <p>首次使用请先创建管理员账户</p>
    </div>
    
    <div class="warning-box">
      <div class="icon">⚠️</div>
      <div class="content">
        <h3>重要提示</h3>
        <p>这是系统首次初始化，创建的账户将拥有最高权限。请妥善保管管理员密码，系统启动后此功能将自动禁用。</p>
      </div>
    </div>
    
    <form class="register-form" id="registerForm">
      <div class="el-form-item">
        <div class="el-input">
          <input 
            type="text" 
            id="username" 
            placeholder="请输入管理员用户名"
            class="el-input__inner"
            autocomplete="username"
            required
          >
        </div>
        <div class="error-message" id="usernameError"></div>
      </div>
      
      <div class="el-form-item">
        <div class="el-input">
          <input 
            type="password" 
            id="password" 
            placeholder="请输入密码（至少 8 位）"
            class="el-input__inner"
            autocomplete="new-password"
            required
          >
        </div>
        <div class="password-strength" id="passwordStrength" style="display: none;">
          <div class="bar" id="passwordStrengthBar"></div>
        </div>
        <div class="error-message" id="passwordError"></div>
      </div>
      
      <div class="el-form-item">
        <div class="el-input">
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="请再次输入密码"
            class="el-input__inner"
            autocomplete="new-password"
            required
          >
        </div>
        <div class="error-message" id="confirmPasswordError"></div>
      </div>
      
      <div id="errorMessage" class="error-message" style="text-align: center;"></div>
      <div id="successMessage" class="success-message">✓ 管理员账户创建成功！正在跳转...</div>
      
      <button type="submit" class="el-button el-button--primary register-btn" id="registerBtn">
        创建管理员账户
      </button>
    </form>
    
    <div class="back-link">
      <a href="login.html">← 返回登录页面</a>
    </div>
  </div>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordStrength = document.getElementById('passwordStrength');
    const passwordStrengthBar = document.getElementById('passwordStrengthBar');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const registerBtn = document.getElementById('registerBtn');
    
    // 密码强度计算
    function calculatePasswordStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (password.length >= 12) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/\d/.test(password)) strength++;
      if (/[^a-zA-Z0-9]/.test(password)) strength++;
      return Math.min(strength, 4);
    }
    
    // 更新密码强度显示
    function updatePasswordStrength(password) {
      if (!password) {
        passwordStrength.style.display = 'none';
        return;
      }
      
      passwordStrength.style.display = 'block';
      const strength = calculatePasswordStrength(password);
      
      passwordStrengthBar.className = 'bar';
      if (strength <= 1) {
        passwordStrengthBar.classList.add('weak');
      } else if (strength <= 2) {
        passwordStrengthBar.classList.add('medium');
      } else {
        passwordStrengthBar.classList.add('strong');
      }
    }
    
    // 实时密码强度检测
    passwordInput.addEventListener('input', function() {
      updatePasswordStrength(this.value);
    });
    
    // 清除对应错误信息
    function clearError(inputId) {
      const errorDiv = document.getElementById(inputId + 'Error');
      if (errorDiv) {
        errorDiv.textContent = '';
        errorDiv.style.display = 'none';
      }
    }
    
    // 设置错误信息
    function setError(inputId, message) {
      const errorDiv = document.getElementById(inputId + 'Error');
      if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
      }
    }
    
    // 验证密码强度
    function validatePassword(password) {
      if (password.length < 8) {
        return '密码至少需要 8 个字符';
      }
      return null;
    }
    
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // 清除所有错误信息
      errorMessage.style.display = 'none';
      usernameError.style.display = 'none';
      passwordError.style.display = 'none';
      confirmPasswordError.style.display = 'none';
      
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      
      let hasError = false;
      
      // 验证用户名
      if (!username) {
        setError('username', '请输入用户名');
        hasError = true;
      }
      
      // 验证密码
      const passwordError = validatePassword(password);
      if (passwordError) {
        setError('password', passwordError);
        hasError = true;
      }
      
      // 验证密码确认
      if (password !== confirmPassword) {
        setError('confirmPassword', '两次输入的密码不一致');
        hasError = true;
      }
      
      if (hasError) {
        return;
      }
      
      // 提交注册
      registerBtn.disabled = true;
      registerBtn.textContent = '创建中...';
      form.classList.add('loading');
      
      try {
        const response = await axios.post('/api/auth/bootstrap', {
          username: username,
          password: password
        });
        
        // 显示成功消息
        successMessage.style.display = 'block';
        
        // 2 秒后跳转到登录页面
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        
      } catch (error) {
        console.error('Registration error:', error);
        
        let errorMsg = '创建失败，请稍后重试';
        if (error.response) {
          const data = error.response.data;
          if (data.message) {
            errorMsg = data.message;
          } else if (data.error) {
            errorMsg = data.error;
          }
        }
        
        // 特殊错误处理
        if (errorMsg.includes('bootstrap is disabled')) {
          errorMsg = '系统已初始化，请联系系统管理员';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        }
        
        errorMessage.textContent = errorMsg;
        errorMessage.style.display = 'block';
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = '创建管理员账户';
        form.classList.remove('loading');
      }
    });
    
    // 输入时清除错误
    usernameInput.addEventListener('input', () => clearError('username'));
    passwordInput.addEventListener('input', () => clearError('password'));
    confirmPasswordInput.addEventListener('input', () => clearError('confirmPassword'));
    
    // 页面加载时检查是否已初始化
    window.addEventListener('DOMContentLoaded', async function() {
      usernameInput.focus();
      
      try {
        const response = await fetch('/api/auth/bootstrap-status');
        const data = await response.json();
        
        if (!data.isBootstrapMode) {
          // 系统已初始化，显示提示信息并跳转
          errorMessage.textContent = '系统已完成初始化，正在跳转到登录页面...';
          errorMessage.style.display = 'block';
          errorMessage.style.color = '#faad14';
          
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        }
      } catch (error) {
        console.error('Failed to check bootstrap status:', error);
      }
    });
  </script>
</body>
</html>
