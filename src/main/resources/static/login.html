<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能协同审批系统 - 登录</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      width: 420px;
      max-width: 90%;
      margin: 20px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-header h1 {
      color: #333;
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 10px 0;
    }
    
    .login-header p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    
    .login-form {
      margin-top: 20px;
    }
    
    .login-form .el-form-item {
      margin-bottom: 24px;
    }
    
    .login-form .el-input__wrapper {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
    }
    
    .login-btn {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3) !important;
    }
    
    .forgot-password {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 20px;
    }
    
    .forgot-password a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.3s ease;
    }
    
    .forgot-password a:hover {
      color: #764ba2;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .divider span {
      padding: 0 15px;
      color: #999;
      font-size: 14px;
    }
    
    .social-login {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    
    .social-btn {
      flex: 1;
      height: 45px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .social-btn:hover {
      border-color: #667eea;
      transform: translateY(-1px);
    }
    
    .register-link {
      text-align: center;
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
    
    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      margin-left: 5px;
    }
    
    .error-message {
      color: #f56c6c;
      font-size: 13px;
      margin-top: 5px;
      text-align: left;
    }
    
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
        width: 95%;
      }
      
      .login-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>欢迎回来</h1>
      <p>请登录您的账户继续使用</p>
    </div>
    
    <form class="login-form" id="loginForm">
      <div class="el-form-item">
        <div class="el-input">
          <input 
            type="text" 
            id="username" 
            placeholder="用户名或邮箱"
            class="el-input__inner"
            autocomplete="username"
            required
          >
        </div>
      </div>
      
      <div class="el-form-item">
        <div class="el-input">
          <input 
            type="password" 
            id="password" 
            placeholder="密码"
            class="el-input__inner"
            autocomplete="current-password"
            required
          >
        </div>
      </div>
      
      <div class="el-form-item">
        <label class="el-checkbox">
          <input type="checkbox" id="rememberMe" class="el-checkbox__original">
          <span class="el-checkbox__input">
            <span class="el-checkbox__inner"></span>
          </span>
          <span class="el-checkbox__label">记住我</span>
        </label>
      </div>
      
      <div id="errorMessage" class="error-message" style="display: none;"></div>
      
      <button type="submit" class="el-button el-button--primary login-btn">
        登录
      </button>
    </form>
    
    <div class="forgot-password">
      <a href="#" onclick="showForgotPassword()">忘记密码？</a>
    </div>
    
    <div class="divider">
      <span>或使用其他方式登录</span>
    </div>
    
    <div class="social-login">
      <button class="social-btn" title="微信登录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="#07C160"/>
        </svg>
      </button>
      <button class="social-btn" title="钉钉登录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm4 0h-2v-6h2v6z" fill="#1890FF"/>
        </svg>
      </button>
      <button class="social-btn" title="企业微信登录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#00C292"/>
        </svg>
      </button>
    </div>
    
    <div class="register-link">
      还没有账户？
      <a href="#" onclick="showRegister()">立即注册</a>
    </div>
  </div>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    // 页面加载时检查是否处于引导模式（未初始化管理员）
    window.addEventListener('DOMContentLoaded', async function() {
      try {
        const response = await fetch('/api/auth/bootstrap-status');
        const data = await response.json();
        
        if (data.isBootstrapMode) {
          // 系统未初始化，自动跳转到管理员注册页面
          window.location.href = 'admin-register.html';
        }
      } catch (error) {
        console.error('Failed to check bootstrap status:', error);
        // 如果检查失败，仍然允许访问登录页面
      }
    });
    
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const errorMessage = document.getElementById('errorMessage');
      
      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }
      
      try {
        // 隐藏错误信息
        errorMessage.style.display = 'none';
        
        // 直接提交表单到 Spring Security 默认登录端点
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);
        if (rememberMe) {
          formData.append('remember-me', 'true');
        }
        
        // 提交到 Spring Security 默认登录端点
        const response = await fetch('/login', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest' // For AJAX detection
          }
        });
        
        if (response.ok || response.redirected) {
          // 登录成功，重定向到主页
          window.location.href = '/';
        } else if (response.status === 401) {
          showError('用户名或密码错误');
        } else {
          showError('登录失败，请检查用户名和密码');
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('网络错误，请稍后重试');
      }
    });
    
    function showError(message) {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }
    
    function showForgotPassword() {
      alert('忘记密码功能正在开发中...');
    }
    
    function showRegister() {
      alert('注册功能正在开发中...');
    }
    
    // 页面加载时自动聚焦到用户名输入框
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('username').focus();
    });
  </script>
</body>
</html>
