<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认证鉴权测试</title>
    <link href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1890ff;
            border-left: 4px solid #1890ff;
            padding-left: 12px;
        }
        .response {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="container">
        <h1>🔐 认证鉴权测试页面</h1>

        <!-- 登录测试 -->
        <div class="card">
            <h2>1. 用户登录</h2>
            <el-form :model="loginForm" label-width="100px">
                <el-form-item label="用户名">
                    <el-input v-model="loginForm.username" placeholder="请输入用户名"></el-input>
                </el-form-item>
                <el-form-item label="密码">
                    <el-input v-model="loginForm.password" type="password" placeholder="请输入密码"></el-input>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" @click="login">登录</el-button>
                </el-form-item>
            </el-form>
            <div v-if="loginResponse" class="response">
                <strong>响应：</strong>
                <pre>{{ JSON.stringify(loginResponse, null, 2) }}</pre>
            </div>
        </div>

        <!-- 2FA 测试 -->
        <div class="card" v-if="show2fa">
            <h2>2. 2FA 验证</h2>
            <el-form :model="twoFaForm" label-width="100px">
                <el-form-item label="挑战令牌">
                    <el-input v-model="twoFaForm.challengeToken" readonly></el-input>
                </el-form-item>
                <el-form-item label="6 位验证码">
                    <el-input v-model="twoFaForm.code" placeholder="请输入 TOTP 验证码"></el-input>
                </el-form-item>
                <el-form-item>
                    <el-button type="success" @click="verify2fa">验证</el-button>
                </el-form-item>
            </el-form>
            <div v-if="twoFaResponse" class="response">
                <strong>响应：</strong>
                <pre>{{ JSON.stringify(twoFaResponse, null, 2) }}</pre>
            </div>
        </div>

        <!-- 获取用户信息 -->
        <div class="card">
            <h2>3. 获取当前用户信息</h2>
            <el-button type="info" @click="getProfile">获取用户信息</el-button>
            <div v-if="profileResponse" class="response">
                <strong>响应：</strong>
                <pre>{{ JSON.stringify(profileResponse, null, 2) }}</pre>
            </div>
        </div>

        <!-- 2FA 设置 -->
        <div class="card">
            <h2>4. 2FA 设置</h2>
            <el-button type="warning" @click="setup2fa">获取 2FA 设置</el-button>
            <div v-if="setupResponse" class="response">
                <strong>响应：</strong>
                <pre>{{ JSON.stringify(setupResponse, null, 2) }}</pre>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;
    const API_BASE = 'http://localhost:8080/api';

    createApp({
        data() {
            return {
                loginForm: {
                    username: '',
                    password: ''
                },
                twoFaForm: {
                    challengeToken: '',
                    code: ''
                },
                loginResponse: null,
                twoFaResponse: null,
                profileResponse: null,
                setupResponse: null,
                show2fa: false,
                accessToken: null
            };
        },
        methods: {
            async login() {
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.loginForm)
                    });
                    const data = await res.json();
                    this.loginResponse = data;

                    if (data.twoFactorRequired) {
                        this.show2fa = true;
                        this.twoFaForm.challengeToken = data.challengeToken;
                    } else if (data.accessToken) {
                        this.accessToken = data.accessToken;
                        this.show2fa = false;
                    }
                } catch (e) {
                    this.loginResponse = { error: e.message };
                }
            },
            async verify2fa() {
                try {
                    const res = await fetch(`${API_BASE}/auth/login/2fa`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.twoFaForm)
                    });
                    const data = await res.json();
                    this.twoFaResponse = data;
                    if (data.accessToken) {
                        this.accessToken = data.accessToken;
                        this.show2fa = false;
                    }
                } catch (e) {
                    this.twoFaResponse = { error: e.message };
                }
            },
            async getProfile() {
                try {
                    const res = await fetch(`${API_BASE}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${this.accessToken}` }
                    });
                    const data = await res.json();
                    this.profileResponse = data;
                } catch (e) {
                    this.profileResponse = { error: e.message };
                }
            },
            async setup2fa() {
                try {
                    const res = await fetch(`${API_BASE}/auth/2fa/setup`, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${this.accessToken}` }
                    });
                    const data = await res.json();
                    this.setupResponse = data;
                } catch (e) {
                    this.setupResponse = { error: e.message };
                }
            }
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
