spring.application.name: approval-system
server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/approval_system?useSSL=false&serverTimezone=UTC}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:000001}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

flowable:
  database-schema-update: true
  process:
    definition-location-prefix: classpath:/processes/
  rest:
    api:
      enabled: true

security:
  jwt:
    issuer: approval-system
    secret: "approval-system-jwt-secret-key-change-this-please-32bytes"
    access-token-minutes: 120
    challenge-token-minutes: 5
  totp:
    issuer: ApprovalSystem
  account:
    max-login-attempts: 5
    lock-duration-minutes: 30
  audit:
    login-logs-retention-days: 90
  settings:
    crypto-key: ${SETTINGS_CRYPTO_KEY:approval-system-settings-crypto-key-change-this}

app:
  upload:
    path: ${UPLOAD_PATH:./uploads}
    allowed-extensions: pdf,docx,xlsx,pptx,png,jpg,jpeg

ai:
  llm:
    provider: ${AI_LLM_PROVIDER:mock}
    # mock-model: mock-approval-advisor-v1
    openai:
      base-url: ${AI_LLM_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${AI_LLM_OPENAI_MODEL:gpt-5.4-mini}
      temperature: 0.2
      connect-timeout-seconds: 10
      read-timeout-seconds: 30
