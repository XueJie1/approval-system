spring.application.name: approval-system
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/approval_system?useSSL=false&serverTimezone=UTC
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: "000001"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

flowable:
  database-schema-update: true
  process:
    definition-location-prefix: classpath:/processes/
  rest:
    api:
      enabled: true

security:
  jwt:
    issuer: approval-system
    secret: "approval-system-jwt-secret-key-change-this-please-32bytes"
    access-token-minutes: 120
    challenge-token-minutes: 5
  totp:
    issuer: ApprovalSystem
  account:
    max-login-attempts: 5
    lock-duration-minutes: 30
  audit:
    login-logs-retention-days: 90
