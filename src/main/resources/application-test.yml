spring:
  datasource:
    url: jdbc:h2:mem:approval_system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

flowable:
  database-schema-update: true
  process:
    definition-location-prefix: classpath:/processes/
  rest:
    api:
      enabled: true

security:
  settings:
    crypto-key: test-settings-crypto-key
