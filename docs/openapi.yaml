openapi: 3.0.3
info:
  title: Approval System API
  version: 1.0.0
  description: 基于当前代码实现整理的接口文档（Spring Boot + Flowable）

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Workflow
  - name: Requests
  - name: Forms
  - name: RBAC

paths:
  /api/workflow/requests:
    post:
      tags: [Workflow]
      summary: 发起流程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProcessRequest'
            example:
              businessKey: BR-20260224-0001
              title: 差旅申请-上海
              applicantId: 1001
              applicantDeptId: 10
              applicantPostId: 101
              processKey: approvalWorkflow
              variables:
                amount: 3200
                reason: 客户拜访
              countersignUsers: ["1002", "1003"]
              countersignMode: ALL
              passRatio: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartProcessResponse'
              example:
                processInstanceId: "4b8d6c88-f1ab-11ee-9f9a-0242ac120002"
                message: Process started successfully
        '403':
          description: 权限不足（非 EMPLOYEE）

  /api/workflow/tasks:
    get:
      tags: [Workflow]
      summary: 查询用户任务
      parameters:
        - name: assignee
          in: query
          required: true
          description: 任务办理人（用户ID字符串）
          schema:
            type: string
            example: "1002"
        - name: includeCandidate
          in: query
          required: false
          description: 是否同时查询候选任务
          schema:
            type: boolean
            default: false
            example: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskInfo'
              example:
                - taskId: "c9a4c8b2-f1ab-11ee-9f9a-0242ac120002"
                  taskName: 部门主管审批
                  processInstanceId: "4b8d6c88-f1ab-11ee-9f9a-0242ac120002"
                  assignee: "1002"
                  createTime: "2026-02-24T10:20:30Z"

  /api/workflow/tasks/{taskId}/claim:
    post:
      tags: [Workflow]
      summary: 认领任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimTaskRequest'
            example:
              userId: "1002"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task claimed

  /api/workflow/tasks/{taskId}/complete:
    post:
      tags: [Workflow]
      summary: 完成审批任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
            example:
              userId: "1002"
              approvalResult: APPROVE
              comments: 同意，预算合理
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task completed

  /api/workflow/tasks/{taskId}/delegate:
    post:
      tags: [Workflow]
      summary: 委派任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegateTaskRequest'
            example:
              userId: "1002"
              delegateUserId: "1005"
              comment: 我出差中，委派处理
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task delegated

  /api/workflow/tasks/{taskId}/resolve:
    post:
      tags: [Workflow]
      summary: 委派处理完成（resolve）
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTaskRequest'
            example:
              userId: "1005"
              approvalResult: APPROVE
              comment: 已核实，同意
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task resolved

  /api/workflow/tasks/{taskId}/reassign:
    post:
      tags: [Workflow]
      summary: 转办任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignTaskRequest'
            example:
              userId: "1"
              newAssigneeId: "1006"
              comment: 按组织调整转办
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task reassigned

  /api/workflow/tasks/{taskId}/return:
    post:
      tags: [Workflow]
      summary: 回退到会签节点
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnTaskRequest'
            example:
              userId: "1002"
              comment: 信息不完整，退回补充
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task returned

  /api/workflow/tasks/{taskId}/return/previous:
    post:
      tags: [Workflow]
      summary: 回退到上一步
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnTaskRequest'
            example:
              userId: "1002"
              comment: 退回上一步重新审批
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task returned to previous

  /api/workflow/tasks/{taskId}/return/target:
    post:
      tags: [Workflow]
      summary: 回退到指定节点
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnToTargetRequest'
            example:
              userId: "1002"
              targetActivityId: managerApproveTask
              comment: 回退到部门主管节点
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task returned to target

  /api/workflow/tasks/{taskId}/return/applicant:
    post:
      tags: [Workflow]
      summary: 回退到发起人
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnTaskRequest'
            example:
              userId: "1002"
              comment: 退回申请人修改
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Task returned to applicant

  /api/workflow/process/{processInstanceId}/cancel:
    post:
      tags: [Workflow]
      summary: 撤销流程
      parameters:
        - name: processInstanceId
          in: path
          required: true
          description: 流程实例ID
          schema:
            type: string
            example: "4b8d6c88-f1ab-11ee-9f9a-0242ac120002"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelProcessRequest'
            example:
              userId: "1001"
              comment: 申请内容有误，撤销后重提
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Process cancelled

  /api/requests:
    get:
      tags: [Requests]
      summary: 按数据权限查询申请单
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BizRequest'
              example:
                - id: 1
                  businessKey: BR-20260224-0001
                  processInstanceId: "4b8d6c88-f1ab-11ee-9f9a-0242ac120002"
                  processDefinitionId: approvalWorkflow:3:7504
                  formInstanceId: 88
                  applicantId: 1001
                  applicantDeptId: 10
                  applicantPostId: 101
                  title: 差旅申请-上海
                  status: 2
                  currentTaskId: "c9a4c8b2-f1ab-11ee-9f9a-0242ac120002"
                  currentAssigneeId: 1002
                  submitTime: "2026-02-24T10:20:30Z"
                  finishTime: null
                  createdAt: "2026-02-24T10:20:00Z"
                  updatedAt: "2026-02-24T10:30:00Z"
                  isDeleted: 0

  /api/requests/tasks:
    get:
      tags: [Requests]
      summary: 查询可见流程任务
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskInfo'
              example:
                - taskId: "c9a4c8b2-f1ab-11ee-9f9a-0242ac120002"
                  taskName: 部门主管审批
                  processInstanceId: "4b8d6c88-f1ab-11ee-9f9a-0242ac120002"
                  assignee: "1002"
                  createTime: "2026-02-24T10:20:30Z"

  /api/requests/logs:
    get:
      tags: [Requests]
      summary: 查询可见审批日志
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BizRequestLog'
              example:
                - id: 101
                  businessKey: BR-20260224-0001
                  processInstanceId: "4b8d6c88-f1ab-11ee-9f9a-0242ac120002"
                  taskId: "c9a4c8b2-f1ab-11ee-9f9a-0242ac120002"
                  operatorId: 1002
                  action: APPROVE
                  comment: 同意
                  createdAt: "2026-02-24T10:35:00Z"

  /api/requests/processes:
    get:
      tags: [Requests]
      summary: 查询可见流程实例
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessInfo'
              example:
                - processInstanceId: "4b8d6c88-f1ab-11ee-9f9a-0242ac120002"
                  processDefinitionId: approvalWorkflow:3:7504
                  businessKey: BR-20260224-0001

  /api/forms/definitions:
    post:
      tags: [Forms]
      summary: 创建表单定义（需 DESIGNER）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormDefinitionRequest'
            example:
              userId: 2001
              formKey: travel_request
              formName: 差旅申请表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
              example:
                id: 1
                formName: 差旅申请表
                formKey: travel_request
                status: 1
        '403':
          description: 权限不足

  /api/forms/versions:
    post:
      tags: [Forms]
      summary: 创建表单版本（需 DESIGNER）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormVersionRequest'
            example:
              userId: 2001
              formId: 1
              schemaJson: "{\"title\":\"差旅申请\",\"type\":\"object\"}"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersion'
              example:
                id: 3
                formId: 1
                version: 3
                schemaJson: "{\"title\":\"差旅申请\",\"type\":\"object\"}"
        '403':
          description: 权限不足

  /api/forms/fields:
    post:
      tags: [Forms]
      summary: 替换表单字段（需 DESIGNER）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceFieldsRequest'
            example:
              userId: 2001
              formVersionId: 3
              fields:
                - fieldKey: destination
                  fieldType: string
                  label: 出差地点
                  required: true
                - fieldKey: budget
                  fieldType: number
                  label: 预算金额
                  required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Fields updated
        '403':
          description: 权限不足
    get:
      tags: [Forms]
      summary: 获取表单字段
      parameters:
        - name: formVersionId
          in: query
          required: true
          description: 表单版本ID
          schema:
            type: integer
            format: int64
            example: 3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormField'
              example:
                - id: 11
                  formVersionId: 3
                  fieldKey: destination
                  fieldType: string
                  label: 出差地点
                  required: 1
                  visibleRule: null
                  validateRule: null
                  optionsJson: null

  /api/forms/versions/latest:
    get:
      tags: [Forms]
      summary: 获取指定表单Key最新版本
      parameters:
        - name: formKey
          in: query
          required: true
          description: 表单唯一键
          schema:
            type: string
            example: travel_request
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersion'
              example:
                id: 3
                formId: 1
                version: 3
                schemaJson: "{\"title\":\"差旅申请\",\"type\":\"object\"}"

  /api/forms/instances:
    post:
      tags: [Forms]
      summary: 创建表单实例（需 EMPLOYEE）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormInstanceRequest'
            example:
              userId: 1001
              formVersionId: 3
              businessKey: BR-20260224-0001
              data:
                destination: 上海
                budget: 3200
                days: 3
                reason: 客户拜访
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormInstance'
              example:
                id: 88
                formVersionId: 3
                businessKey: BR-20260224-0001
                dataJson: "{\"destination\":\"上海\",\"budget\":3200,\"days\":3}"
        '400':
          description: 参数或校验失败
        '403':
          description: 权限不足

  /api/forms/validate:
    post:
      tags: [Forms]
      summary: 校验表单数据（需 EMPLOYEE）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateFormInstanceRequest'
            example:
              userId: 1001
              formVersionId: 3
              data:
                destination: 上海
                budget: 3200
                days: 3
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Validation passed
        '400':
          description: 校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormValidationErrorResponse'
              example:
                error: Form validation failed
                errors:
                  - field: budget
                    code: required
                    message: budget is required
        '403':
          description: 权限不足

  /api/rbac/users:
    post:
      tags: [RBAC]
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              operatorId: 1
              username: zhangsan
              password: "P@ssw0rd123"
              deptId: 2
              status: 1
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacUserResponse'
              example:
                id: 10
                username: zhangsan
                deptId: 2
                status: 1
        '400':
          description: 参数校验失败
        '403':
          description: 权限不足
        '409':
          description: 资源冲突（如用户名重复）

  /api/rbac/roles:
    post:
      tags: [RBAC]
      summary: 创建角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              operatorId: 1
              roleCode: EMPLOYEE
              roleName: 普通员工
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysRole'
              example:
                id: 3
                roleCode: EMPLOYEE
                roleName: 普通员工
                status: 1
        '400':
          description: 参数校验失败
        '403':
          description: 权限不足
        '409':
          description: 资源冲突（如角色编码重复）

  /api/rbac/depts:
    post:
      tags: [RBAC]
      summary: 创建部门
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeptRequest'
            example:
              operatorId: 1
              deptName: 财务部
              parentId: 1
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysDept'
              example:
                id: 2
                parentId: 1
                deptName: 财务部
        '400':
          description: 参数校验失败
        '403':
          description: 权限不足

  /api/rbac/posts:
    post:
      tags: [RBAC]
      summary: 创建岗位
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            example:
              operatorId: 1
              postCode: FINANCE_MANAGER
              postName: 财务经理
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysPost'
              example:
                id: 5
                postCode: FINANCE_MANAGER
                postName: 财务经理
        '400':
          description: 参数校验失败
        '403':
          description: 权限不足
        '409':
          description: 资源冲突（如岗位编码重复）

  /api/rbac/assign:
    post:
      tags: [RBAC]
      summary: 用户绑定角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
            example:
              operatorId: 1
              userId: 10
              roleId: 3
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Role assigned
        '400':
          description: 参数错误（如用户或角色不存在）
        '403':
          description: 权限不足

  /api/rbac/assign-post:
    post:
      tags: [RBAC]
      summary: 用户绑定岗位
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPostRequest'
            example:
              operatorId: 1
              userId: 10
              postId: 5
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Post assigned
        '400':
          description: 参数错误（如用户或岗位不存在）
        '403':
          description: 权限不足

  /api/rbac/role-data-scope:
    post:
      tags: [RBAC]
      summary: 配置角色数据权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRoleDataScopeRequest'
            example:
              operatorId: 1
              roleId: 3
              scopeType: DEPT_AND_CHILD
              deptId: 2
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
              example:
                success: true
                message: Role data scope added
        '400':
          description: 参数错误（如角色不存在或scopeType非法）
        '403':
          description: 权限不足

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: Flowable任务ID
      schema:
        type: string
        example: "c9a4c8b2-f1ab-11ee-9f9a-0242ac120002"
    UserIdQuery:
      name: userId
      in: query
      required: true
      description: 当前登录用户ID
      schema:
        type: integer
        format: int64
        example: 1001

  schemas:
    ActionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        message:
          type: string
          description: 操作结果说明
          example: Task completed

    StartProcessRequest:
      type: object
      required: [title, applicantId]
      properties:
        businessKey:
          type: string
          description: 业务主键，不传则后端自动生成
          example: BR-20260224-0001
        title:
          type: string
          description: 申请标题
          example: 差旅申请-上海
        applicantId:
          type: integer
          format: int64
